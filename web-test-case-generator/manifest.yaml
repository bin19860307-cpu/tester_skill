name: web-test-case-generator
display_name: web-test-case-generator
version: 1.0.0
author: chenb
category: 测试效能
description: "根据提供的网站页面自动生成测试用例。支持 UI 测试、功能测试、流程测试、异常测试、权限测试和兼容性测试。输出格式支持 Markdown 表格和 CSV。"
triggers:
  - 分析 git diff
  - 评估 PR 影响范围
  - 制定回归测试计划
  - tagdiff.txt 分析
  - compare_vX_to_Y.md 分析
  - 生成变更报告
tags:
  - code-review
  - diff
  - risk-analysis
  - testing
  - ci-cd
  - agent-skill
license: MIT
